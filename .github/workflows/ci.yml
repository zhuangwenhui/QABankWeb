name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 全量测试
        run: python -m pytest tests/ -q
      - name: 依赖安全审计(pip-audit,仅告警不阻断)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  jssyntax:
    # static/js/ 全部无运行时测试,此为最低护栏:抓语法/引用错(如 qd_render 抽取类改动)。
    # 注意它只跑 node --check:能抓"写错了语法",抓不到"逻辑错了"。真正的端到端在 e2e 那个 job。
    # (此处原写死"前端 4326 行",实测已是 4603 行且每次改动都在变 —— 不再记数字。)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS 语法检查(node --check)
        run: |
          set -e
          for f in static/js/*.js; do
            echo "check $f"
            node --check "$f"
          done

  mathrender:
    # 2026-07-25 线上事故:题解数学全部退化成 LaTeX 源码,而全部本地检查与 pytest 都通过 ——
    # 因为 localhost 零延迟时题解能抢在 MathJax 开场排版之前落地。本 job 强制注入网络延迟
    # 并把题解 API 压到开场排版之后,再验证页面上没有残留的 $…$ 源码。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt websocket-client
      - name: 数学渲染端到端(含故障注入)
        run: python scripts/e2e_math_render.py --both --wait 26

  shellcheck:
    # 备份/恢复/部署脚本出错的代价最高(数据没了才发现),而它们最没有测试覆盖。
    # shellcheck 能抓未引用变量、误吞退出码这类正是本仓踩过的坑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell 静态检查(bash -n + shellcheck)
        run: |
          set -e
          pip install shellcheck-py==0.11.0.1
          for f in deploy/*.sh scripts/*.sh; do
            echo "check $f"
            bash -n "$f"
          done
          shellcheck -S warning deploy/*.sh scripts/*.sh
