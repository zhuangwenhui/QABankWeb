name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 全量测试
        run: python -m pytest tests/ -q
      - name: 依赖安全审计(pip-audit,仅告警不阻断)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  jssyntax:
    # 两层:node --check 抓语法/引用错;node --test 抓**逻辑错**。
    #
    # 加第二层是因为 2026-07-28 那次线上事故:列表预览的截断把 $$…$$ 剖成两半,
    # 33 道题在题目管理页露出 LaTeX 源码。那是个 20 行纯函数里的逻辑错误 ——
    # node --check 过、pytest 过(它只能做源码文本断言)、渲染巡检也报绿,
    # 最后是用户在生产上用肉眼发现的。现在 tests/js/ 里有它的行为测试:
    # 把代码退回修复前,那一层立刻报 4 条失败(含 #348 的真实题面)。
    #
    # 仍然不覆盖需要真实 DOM/MathJax 的部分,那是 mathrender 那个 job 的活。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS 语法检查(node --check)
        run: |
          set -e
          for f in static/js/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: JS 行为测试(node --test)
        run: node --test tests/js/

  mathrender:
    # 2026-07-25 线上事故:题解数学全部退化成 LaTeX 源码,而全部本地检查与 pytest 都通过 ——
    # 因为 localhost 零延迟时题解能抢在 MathJax 开场排版之前落地。本 job 强制注入网络延迟
    # 并把题解 API 压到开场排版之后,再验证页面上没有残留的 $…$ 源码。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt websocket-client
      - name: 数学渲染端到端(含故障注入)
        run: python scripts/e2e_math_render.py --both --wait 26

  shellcheck:
    # 备份/恢复/部署脚本出错的代价最高(数据没了才发现),而它们最没有测试覆盖。
    # shellcheck 能抓未引用变量、误吞退出码这类正是本仓踩过的坑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell 静态检查(bash -n + shellcheck)
        run: |
          set -e
          pip install shellcheck-py==0.11.0.1
          for f in deploy/*.sh scripts/*.sh; do
            echo "check $f"
            bash -n "$f"
          done
          shellcheck -S warning deploy/*.sh scripts/*.sh
